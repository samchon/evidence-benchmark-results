packages:
  - config
  - packages/api
  - packages/backend
  - packages/frontend

modulesCacheMaxAge: 0

# The Prisma SQLite adapter still requires better-sqlite3 11, which publishes no
# prebuilt binary for current Node releases and therefore compiles from source
# on every install. Pinning both consumers to the catalog version keeps the
# workspace installable on any Node the operator happens to run.
overrides:
  better-sqlite3: 12.11.1

onlyBuiltDependencies:
  - "@prisma/engines"
  - better-sqlite3
  - esbuild
  - prisma

catalogs:
  samchon:
    nestia: "^12.1.0"
    "@nestia/core": "^12.1.0"
    "@nestia/e2e": "^12.1.0"
    "@nestia/fetcher": "^12.1.0"
    "@nestia/sdk": "^12.1.0"
    typia: "^13.2.0"

  typescript:
    typescript: "^7.0.2"
    ttsc: "^0.24.0"
    "@ttsc/lint": "^0.24.0"
    "@ttsc/unplugin": "^0.24.0"

  utils:
    "@types/node": "^25.3.0"
    rimraf: "^6.1.2"

  backend:
    "@nestjs/common": "11.1.3"
    "@nestjs/core": "11.1.3"
    "@nestjs/platform-express": "11.1.3"
    prisma: "7.0.0"
    "@prisma/adapter-better-sqlite3": "7.0.0"
    "@prisma/client": "7.0.0"
    better-sqlite3: "12.11.1"
    prisma-markdown: "4.0.0"
    dotenv: "16.4.5"
    dotenv-expand: "12.0.3"
    express: "4.22.2"
    reflect-metadata: "0.2.2"
    rxjs: "7.8.2"
    source-map-support: "0.5.21"
    swagger-ui-express: "5.0.1"
    tstl: "3.0.0"
    "@types/express": "4.17.25"
    "@types/node": "^25.3.0"
    "@types/swagger-ui-express": "4.1.8"

  frontend:
    "@tailwindcss/vite": "4.3.0"
    "@playwright/test": "1.61.1"
    "@tanstack/react-query": "5.101.4"
    react: "19.1.1"
    react-dom: "19.1.1"
    react-router-dom: "7.18.1"
    sonner: "2.0.7"
    tailwindcss: "4.3.0"
    "@types/react": "19.1.10"
    "@types/react-dom": "19.1.10"
    vite: "6.3.5"
    "@vitejs/plugin-react": "4.5.0"
