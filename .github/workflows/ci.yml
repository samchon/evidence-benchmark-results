name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  API_PORT: "37001"
  JWT_SECRET_KEY: ci-only-jwt-secret-key-at-least-32-characters
  JWT_ACCESS_TTL_SECONDS: "3600"
  JWT_REFRESH_TTL_SECONDS: "2592000"
  VITE_API_HOST: http://127.0.0.1:37001
  VITE_API_SIMULATE: "true"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.results.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: results
        name: Validate and discover results
        shell: bash
        run: echo "matrix=$(node scripts/discover-results.mjs)" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    if: needs.discover.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: ${{ matrix.path }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Prepare database
        run: pnpm prepare:database

      - name: Test backend
        run: pnpm test:backend

      - name: Install Chromium
        run: pnpm --filter ${{ matrix.frontend }} exec playwright install --with-deps chromium

      - name: Test frontend
        run: pnpm test:frontend
